<!DOCTYPE html>
<html>
<head>
    <title>HandDrop - Receiver</title>
    <style>
        body { 
            background: #000; color: white; font-family: sans-serif; 
            margin: 0; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; height: 100vh;
        }
        #frame { 
            width: 320px; height: 520px; border: 5px solid #222; 
            border-radius: 45px; overflow: hidden; background: #050505;
            box-shadow: 0 0 40px rgba(0,255,0,0.15); position: relative;
        }
        #display-canvas {
            width: 100%; height: 100%; display: block; background: #111;
        }
        #msg { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; font-size: 15px; letter-spacing: 1.5px; 
            color: #666; z-index: 10;
        }
        video { 
            position: fixed; bottom: 20px; right: 20px; 
            width: 130px; height: 95px; border: 3px solid lime; 
            border-radius: 12px;
        }
        #info { 
            position: absolute; top: 30px; font-size: 13px; letter-spacing: 2px; z-index: 20;
        }
    </style>
</head>
<body>
    <div id="info">WAITING FOR SENDER...</div>
    
    <div id="frame">
        <canvas id="display-canvas" width="320" height="520"></canvas>
        <h2 id="msg">SHOW GREEN MARKER<br>TO RECEIVE IMAGE</h2>
    </div>

    <video id="video" autoplay playsinline></video>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD2PiIYxqoTTEYySNOpp8zyrsbc326ODEs",
        authDomain: "handdrop.firebaseapp.com",
        projectId: "handdrop",
        databaseURL: "https://handdrop-default-rtdb.asia-southeast1.firebasedatabase.app",
        storageBucket: "handdrop.firebasestorage.app",
        messagingSenderId: "607985375710",
        appId: "1:607985375710:web:6692a604777858179b654f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'handshake');

    let lastData = null;
    let currentImageSrc = null;

    onValue(dbRef, (snapshot) => {
        lastData = snapshot.val();
    });

    const video = document.getElementById("video");
    const canvas = document.getElementById("display-canvas");
    const ctx = canvas.getContext("2d");
    const msg = document.getElementById("msg");
    const info = document.getElementById("info");

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(stream => video.srcObject = stream);

    // Improved Block-by-Block Animation
    function revealImageBlockByBlock(imgSrc) {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = imgSrc;

        img.onload = () => {
            msg.style.display = "none";
            info.innerText = "IMAGE RECEIVED ✓";
            info.style.color = "lime";

            const blockSize = 18; 
            const cols = Math.ceil(320 / blockSize);
            const rows = Math.ceil(520 / blockSize);
            
            // Create offscreen canvas with full image (This fixes grey blocks)
            const offscreen = document.createElement('canvas');
            offscreen.width = 320;
            offscreen.height = 520;
            const offCtx = offscreen.getContext('2d');
            offCtx.drawImage(img, 0, 0, 320, 520);

            // Generate blocks
            let blocks = [];
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    blocks.push({x: x * blockSize, y: y * blockSize});
                }
            }

            // Random order
            blocks.sort(() => Math.random() - 0.5);

            let index = 0;

            const interval = setInterval(() => {
                if (index >= blocks.length) {
                    clearInterval(interval);
                    return;
                }

                const b = blocks[index];
                
                // Draw from offscreen canvas (guaranteed real image data)
                ctx.drawImage(
                    offscreen,
                    b.x, b.y, blockSize, blockSize,
                    b.x, b.y, blockSize, blockSize
                );

                index++;
            }, 5); // Adjust speed here
        };
    }

    function detectGreen() {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = 160;
        tempCanvas.height = 120;
        const tCtx = tempCanvas.getContext('2d');
        
        tCtx.drawImage(video, 0, 0, 160, 120);
        const data = tCtx.getImageData(0, 0, 160, 120).data;

        let greenCount = 0;
        for (let i = 0; i < data.length; i += 4) {
            const r = data[i], g = data[i+1], b = data[i+2];
            if (g > 55 && g > r * 1.35 && g > b * 1.35) greenCount++;
        }

        console.log("Receiver Green Count:", greenCount);

        if (greenCount > 200 && lastData && lastData.lastImage && lastData.lastImage !== currentImageSrc) {
            currentImageSrc = lastData.lastImage;
            ctx.clearRect(0, 0, 320, 520);
            revealImageBlockByBlock(currentImageSrc);
        }
    }

    setInterval(detectGreen, 250);
</script>
</body>
</html>

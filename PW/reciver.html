<!DOCTYPE html>
<html>
<head>
    <title>HandDrop - Receiver</title>
    <style>
        body { 
            background: #000; color: white; font-family: sans-serif; 
            margin: 0; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; height: 100vh;
        }
        #frame { 
            width: 320px; height: 520px; border: 5px solid #222; 
            border-radius: 45px; overflow: hidden; background: #050505;
            box-shadow: 0 0 40px rgba(0,255,0,0.15);
        }
        #received-img { 
            width: 100%; height: 100%; object-fit: cover; display: none;
        }
        #msg { 
            text-align: center; padding: 30px; font-size: 15px; 
            letter-spacing: 1.5px; color: #666;
        }
        video { 
            position: fixed; bottom: 20px; right: 20px; 
            width: 130px; height: 95px; border: 3px solid lime; 
            border-radius: 12px;
        }
        #info { 
            position: absolute; top: 30px; font-size: 13px; letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div id="info">WAITING FOR SENDER...</div>
    
    <div id="frame">
        <img id="received-img" src="">
        <h2 id="msg">SHOW GREEN MARKER<br>TO RECEIVE IMAGE</h2>
    </div>

    <video id="video" autoplay playsinline></video>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD2PiIYxqoTTEYySNOpp8zyrsbc326ODEs",
        authDomain: "handdrop.firebaseapp.com",
        projectId: "handdrop",
        databaseURL: "https://handdrop-default-rtdb.asia-southeast1.firebasedatabase.app",
        storageBucket: "handdrop.firebasestorage.app",
        messagingSenderId: "607985375710",
        appId: "1:607985375710:web:6692a604777858179b654f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'handshake');

    let lastData = null;

    onValue(dbRef, (snapshot) => {
        lastData = snapshot.val();
    });

    const video = document.getElementById("video");
    const receivedImg = document.getElementById("received-img");
    const msg = document.getElementById("msg");
    const info = document.getElementById("info");

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(stream => video.srcObject = stream);

    function detectGreen() {
        const canvas = document.createElement('canvas');
        canvas.width = 160;
        canvas.height = 120;
        const ctx = canvas.getContext('2d');
        
        ctx.drawImage(video, 0, 0, 160, 120);
        const data = ctx.getImageData(0, 0, 160, 120).data;

        let greenCount = 0;

        for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];

            if (g > 55 && g > r * 1.35 && g > b * 1.35) {
                greenCount++;
            }
        }

        console.log("Receiver Green Count:", greenCount);

        if (greenCount > 200 && lastData && lastData.lastImage) {
            receivedImg.src = lastData.lastImage;
            receivedImg.style.display = "block";
            msg.style.display = "none";
            info.innerText = "IMAGE RECEIVED ✓";
            info.style.color = "lime";
        } else {
            info.innerText = `Green: ${greenCount}`;
            info.style.color = "#888";
        }
    }

    setInterval(detectGreen, 250);
</script>
</body>
</html>

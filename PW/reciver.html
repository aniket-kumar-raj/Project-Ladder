<!DOCTYPE html>
<html>
<head>
    <title>Receiver - HandDrop</title>
    <style>
        body { background: #111; color: white; font-family: sans-serif; text-align: center; }
        #display-area { width: 300px; height: 300px; margin: 20px auto; border: 3px dashed #444; border-radius: 15px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #received-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        video { width: 160px; height: 120px; border: 2px solid lime; position: fixed; bottom: 10px; right: 10px; border-radius: 10px; }
        #info { color: #888; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Receiver</h1>
    <p id="info">Waiting for palm...</p>
    
    <div id="display-area">
        <img id="received-img" src="">
        <h2 id="msg">SHOW PALM TO DOWNLOAD</h2>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" width="160" height="120" style="display:none"></canvas>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD2PiIYxqoTTEYySNOpp8zyrsbc326ODEs",
        authDomain: "handdrop.firebaseapp.com",
        projectId: "handdrop",
        databaseURL: "https://handdrop-default-rtdb.asia-southeast1.firebasedatabase.app", 
        storageBucket: "handdrop.firebasestorage.app",
        messagingSenderId: "607985375710",
        appId: "1:607985375710:web:6692a604777858179b654f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'handshake');

    let lastDataFromSender = null;

    // Constantly monitor what the Sender is doing
    onValue(dbRef, (snapshot) => {
        lastDataFromSender = snapshot.val();
        if (lastDataFromSender && lastDataFromSender.isSenderActive) {
            document.getElementById("info").innerText = "SENDER IS BROADCASTING...";
            document.getElementById("info").style.color = "lime";
        } else {
            document.getElementById("info").innerText = "SENDER IDLE";
            document.getElementById("info").style.color = "#888";
        }
    });

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    navigator.mediaDevices.getUserMedia({ video: true }).then(s => video.srcObject = s);

    function detect() {
        ctx.drawImage(video, 0, 0, 160, 120);
        const pix = ctx.getImageData(0, 0, 160, 120).data;
        let count = 0;
        for (let i = 0; i < pix.length; i += 8) {
            const r=pix[i], g=pix[i+1], b=pix[i+2], sum=r+g+b;
            if (r/sum > 0.4 && g/sum > 0.25 && sum > 150) count++;
        }

        // Action Trigger: Only if Receiver hand is up AND we have data from Sender
        if (count > 800 && lastDataFromSender && lastDataFromSender.lastImage) {
            const imgTag = document.getElementById("received-img");
            imgTag.src = lastDataFromSender.lastImage;
            imgTag.style.display = "block";
            document.getElementById("msg").style.display = "none";
            document.getElementById("display-area").style.borderColor = "lime";
            
            // Optional: You can add a sound effect here for the "Download" feel!
        }
    }
    setInterval(detect, 250);
</script>
</body>
</html>

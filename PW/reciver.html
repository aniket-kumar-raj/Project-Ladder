<!DOCTYPE html>
<html>
<head>
    <title>Receiver - HandDrop</title>
    <style>
        body { background: #000; color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        
        #frame { width: 320px; height: 500px; border: 4px solid #222; border-radius: 40px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background: #050505; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        
        #received-img { width: 100%; height: 100%; object-fit: cover; display: none; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

        #msg { font-size: 14px; color: #555; text-transform: uppercase; letter-spacing: 2px; text-align: center; padding: 20px; }
        
        video { position: fixed; bottom: 20px; right: 20px; width: 120px; height: 90px; border: 2px solid lime; border-radius: 10px; opacity: 0.8; }
        #info { position: absolute; top: 30px; font-weight: bold; font-size: 12px; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div id="info">WAITING...</div>

    <div id="frame">
        <img id="received-img" src="">
        <h2 id="msg">SHOW PALM TO<br>RECEIVE IMAGE</h2>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" width="160" height="120" style="display:none"></canvas>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD2PiIYxqoTTEYySNOpp8zyrsbc326ODEs",
        authDomain: "handdrop.firebaseapp.com",
        projectId: "handdrop",
        databaseURL: "https://handdrop-default-rtdb.asia-southeast1.firebasedatabase.app", 
        storageBucket: "handdrop.firebasestorage.app",
        messagingSenderId: "607985375710",
        appId: "1:607985375710:web:6692a604777858179b654f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'handshake');

    let lastDataFromSender = null;

    onValue(dbRef, (snapshot) => {
        lastDataFromSender = snapshot.val();
        const info = document.getElementById("info");
        if (lastDataFromSender && lastDataFromSender.isSenderActive) {
            info.innerText = "SENDER ACTIVE";
            info.style.color = "lime";
        } else {
            info.innerText = "SENDER IDLE";
            info.style.color = "#888";
        }
    });

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    navigator.mediaDevices.getUserMedia({ video: true }).then(s => video.srcObject = s);

    function detect() {
        ctx.drawImage(video, 0, 0, 160, 120);
        const pix = ctx.getImageData(0, 0, 160, 120).data;
        let count = 0;
        for (let i = 0; i < pix.length; i += 8) {
            const r=pix[i], g=pix[i+1], b=pix[i+2], sum=r+g+b;
            if (r/sum > 0.4 && g/sum > 0.25 && sum > 150) count++;
        }

        if (count > 800 && lastDataFromSender && lastDataFromSender.lastImage) {
            const imgTag = document.getElementById("received-img");
            imgTag.src = lastDataFromSender.lastImage;
            imgTag.style.display = "block";
            document.getElementById("msg").style.display = "none";
        }
    }
    setInterval(detect, 250);
</script>
</body>
</html>

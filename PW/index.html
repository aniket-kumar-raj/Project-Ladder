<!DOCTYPE html>
<html>
<head>
    <title>HandDrop - Sender</title>
    <style>
        body { 
            background: #000; color: white; font-family: 'Segoe UI', sans-serif; 
            margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; overflow: hidden;
            perspective: 1000px; /* Enables 3D depth for the forward rush effect */
        }
        .phone-mockup { 
            width: 280px; height: 500px; background: #111; 
            border: 12px solid #222; border-radius: 40px; 
            position: relative; overflow: hidden; box-shadow: 0 0 40px rgba(0,255,0,0.2);
            transform-style: preserve-3d;
        }
        .slider-container { 
            display: flex; transition: transform 0.4s ease; height: 100%;
        }
        .slider-container img { 
            width: 280px; height: 500px; object-fit: cover; flex-shrink: 0;
            transition: transform 1.8s cubic-bezier(0.6, -0.28, 0.735, 0.045), opacity 1.8s ease;
        }
        
        /* Cinematic Illusion Animation:
           1. First 20% of time: Pulls slightly backward (scale 0.9) and sinks down for a "wind-up" effect.
           2. Remainder of time: Explodes forward (scale 4), shoots directly past the viewport screen, and fades out.
        */
        @keyframes rushToHand {
            0% {
                transform: scale(1) translateY(0) translateZ(0);
                opacity: 1;
                filter: brightness(1);
            }
            25% {
                transform: scale(0.88) translateY(15px) translateZ(-50px);
                opacity: 1;
                filter: brightness(1.2) drop-shadow(0 0 10px rgba(0,255,0,0.5));
            }
            45% {
                transform: scale(1.1) translateY(-10px) translateZ(50px);
                opacity: 0.9;
            }
            100% {
                transform: scale(4.5) translateY(-150px) translateZ(600px);
                opacity: 0;
                filter: brightness(2.5) drop-shadow(0 0 40px #00ff00);
            }
        }

        .slider-container img.transferring {
            animation: rushToHand 2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            pointer-events: none; /* Disables interaction during the rush */
            z-index: 999;
        }

        #status-bar { 
            position: absolute; top: 30px; width: 100%; text-align: center; 
            font-size: 15px; letter-spacing: 2px; color: #00ff00; z-index: 30; 
        }
        .arrow { 
            position: absolute; top: 50%; transform: translateY(-50%); 
            background: rgba(0,0,0,0.7); border: none; color: #00ff00; 
            font-size: 28px; padding: 12px 16px; cursor: pointer; z-index: 20; 
            border-radius: 50%;
        }
        video { 
            position: fixed; bottom: 20px; left: 20px; 
            width: 140px; height: 100px; border: 3px solid #00ff00; 
            border-radius: 12px; z-index: 5;
        }

        /* Unified Calibration Control Panel */
        .control-panel {
            position: fixed; top: 20px; left: 20px; background: rgba(15, 15, 15, 0.95);
            padding: 15px; border-radius: 12px; border: 1px solid #00ff00;
            z-index: 100; font-size: 13px; width: 230px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .control-panel .control-group { margin-bottom: 15px; }
        .control-panel .control-group:last-child { margin-bottom: 0; }
        .control-panel label { display: block; margin-bottom: 6px; color: #aaa; font-weight: 500; }
        .control-panel input[type="range"] {
            width: 100%; accent-color: #00ff00; margin-bottom: 4px; cursor: pointer;
        }
        .mode-text { text-align: right; font-size: 11px; color: #00ff00; font-weight: bold; }
    </style>
</head>
<body>

    <div class="control-panel">
        <div class="control-group">
            <label for="intensity-slider">Green Color Sensitivity:</label>
            <input type="range" id="intensity-slider" min="1" max="100" value="50">
            <div id="mode-label" class="mode-text">Mode: Standard Green</div>
        </div>
        
        <div class="control-group">
            <label for="pixel-slider">Required Hand Size:</label>
            <input type="range" id="pixel-slider" min="50" max="1500" step="25" value="220">
            <div id="pixel-label" class="mode-text" style="color: #00ff88;">Target: 220 px</div>
        </div>
    </div>

    <div id="status-bar">PLACE GREEN HAND IN FRONT</div>
    
    <div class="phone-mockup">
        <button class="arrow" style="left:10px" onclick="moveSlide(-1)">&#10094;</button>
        <button class="arrow" style="right:10px" onclick="moveSlide(1)">&#10095;</button>
        
        <div class="slider-container" id="slider">
            <img src="pic1.jpg" crossorigin="anonymous">
            <img src="pic2.jpg" crossorigin="anonymous">
            <img src="pic3.jpg" crossorigin="anonymous">
        </div>
    </div>

    <video id="video" autoplay playsinline></video>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD2PiIYxqoTTEYySNOpp8zyrsbc326ODEs",
        authDomain: "handdrop.firebaseapp.com",
        projectId: "handdrop",
        databaseURL: "https://handdrop-default-rtdb.asia-southeast1.firebasedatabase.app",
        storageBucket: "handdrop.firebasestorage.app",
        messagingSenderId: "607985375710",
        appId: "1:607985375710:web:6692a604777858179b654f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'handshake');

    let currentIndex = 0;
    const slider = document.getElementById("slider");
    let isSending = false;
    const statusBar = document.getElementById("status-bar");

    window.moveSlide = (direction) => {
        if (isSending) return;
        currentIndex = (currentIndex + direction + 3) % 3;
        slider.style.transform = `translateX(-${currentIndex * 280}px)`;
    };

    const video = document.getElementById("video");
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(stream => video.srcObject = stream)
        .catch(err => console.error("Camera error:", err));

    // Threshold Parameters State
    let config = {
        gMin: 55,
        ratio: 1.35,
        pixelCount: 220
    };

    const intensitySlider = document.getElementById('intensity-slider');
    const modeLabel = document.getElementById('mode-label');
    const pixelSlider = document.getElementById('pixel-slider');
    const pixelLabel = document.getElementById('pixel-label');

    // Handle Color Shade Selection Logic
    intensitySlider.addEventListener('input', (e) => {
        const value = parseInt(e.target.value);
        
        if (value < 40) {
            // Bright / Neon Greens
            config.gMin = 75 - (value * 0.5);
            config.ratio = 1.45;
            modeLabel.innerText = "Mode: Bright / Neon Green";
            modeLabel.style.color = "#00ff00";
        } else if (value >= 40 && value <= 70) {
            // Balanced Profile
            config.gMin = 55;
            config.ratio = 1.35;
            modeLabel.innerText = "Mode: Standard Green";
            modeLabel.style.color = "#00ff88";
        } else {
            // Deep / Shadow / Dark Greens
            const darkFactor = (value - 70) / 30; // 0.0 to 1.0 range
            config.gMin = Math.round(55 - (darkFactor * 35)); // Lowers baseline to 20
            config.ratio = 1.35 - (darkFactor * 0.20);       // Relaxes strictness to 1.15
            modeLabel.innerText = "Mode: Deep & Dark Greens";
            modeLabel.style.color = "#00aa55";
        }
    });

    // Handle Required Target Pixel Count Logic
    pixelSlider.addEventListener('input', (e) => {
        const value = parseInt(e.target.value);
        config.pixelCount = value;
        pixelLabel.innerText = `Target: ${value} px`;
    });

    function detectGreen() {
        if (isSending) return;

        const canvas = document.createElement('canvas');
        canvas.width = 160;
        canvas.height = 120;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        ctx.drawImage(video, 0, 0, 160, 120);
        const data = ctx.getImageData(0, 0, 160, 120).data;

        let greenCount = 0;

        for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];

            // Evaluate pixel using our calibrated variables
            if (g > config.gMin && g > r * config.ratio && g > b * config.ratio) {
                greenCount++;
            }
        }

        console.log(`Green Count: ${greenCount} | Current Setup -> gMin: ${config.gMin}, ratio: ${config.ratio.toFixed(2)}, target: ${config.pixelCount}`);

        if (greenCount > config.pixelCount) {
            sendImageWithAnimation();
        } else {
            statusBar.innerText = `Green Pixels: ${greenCount} / Target: ${config.pixelCount}`;
            statusBar.style.color = "#ffffff";
            update(dbRef, { isSenderActive: false });
        }
    }

    function sendImageWithAnimation() {
        if (isSending) return;
        isSending = true;

        statusBar.innerText = "✨ TRANSFERRING TO HAND... ✨";
        statusBar.style.color = "#00ff88";

        const allImages = slider.getElementsByTagName('img');
        const activeImage = allImages[currentIndex];

        // Apply the new keyframe animation sequence
        activeImage.classList.add('transferring');

        setTimeout(() => {
            const photos = ["pic1.jpg", "pic2.jpg", "pic3.jpg"];

            update(dbRef, { 
                lastImage: photos[currentIndex], 
                isSenderActive: true 
            }).then(() => {
                statusBar.innerText = "✅ IMAGE SENT TO HAND";
                
                setTimeout(() => {
                    activeImage.classList.remove('transferring');
                    isSending = false;
                }, 1500);
            });
        }, 2000); 
    }

    setInterval(detectGreen, 250);
</script>
</body>

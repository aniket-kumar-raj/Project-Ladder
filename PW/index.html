        <img src="pic3.jpg" id="p3" onclick="selectPic('pic3.jpg', 'p3')">
    </div>

    <video id="video" autoplay playsinline></video>

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'handshake');

    let currentPhoto = "pic1.jpg";

    // Make selectPic accessible to HTML
    window.selectPic = (name, id) => {
        currentPhoto = name;
        document.querySelectorAll('img').forEach(img => img.classList.remove('selected'));
        document.getElementById(id).classList.add('selected');
    };

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const statusText = document.getElementById("status");

    navigator.mediaDevices.getUserMedia({ video: true }).then(s => video.srcObject = s);

    function detect() {
        ctx.drawImage(video, 0, 0, 160, 120);
        const pix = ctx.getImageData(0, 0, 160, 120).data;
        let count = 0;
        for (let i = 0; i < pix.length; i += 8) {
            const r=pix[i], g=pix[i+1], b=pix[i+2], sum=r+g+b;
            if (r/sum > 0.4 && g/sum > 0.25 && sum > 150) count++;
        }

        if (count > 800) {
            statusText.innerText = "SENDER ACTIVE: " + currentPhoto;

</script>
